[project]
name = "gemma-grounded-health"
version = "0.0.1"
description = "A small open Gemma model fine-tuned to answer health questions only from a given abstract and cite its sentences, scored with EvalKit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Biplob Chakraborty" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    # EvalKit is not on PyPI yet; pinned to an exact commit (D-28)
    "evalkit-harness @ git+https://github.com/biplob819/evalkit@06591f8de9b178078c971940a83019a6530fd119",
]

[project.scripts]
ggh = "ggh.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the EvalKit git pin (D-28)

[tool.hatch.build.targets.wheel]
packages = ["src/ggh"]

[tool.hatch.build.targets.sdist]
# ship the package only; the build harness, specs and design docs live in the repo
include = ["src/ggh", "README.md", "LICENSE", "NOTICE", "changelog.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the › separator used in proof cells

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "contract: schema, EvalKit import, CLI and file-format contract tests",
    "golden: recorded end-to-end fixtures reproduce stored outputs exactly",
    "data: manifests, PQA-L isolation and provenance",
    "recipe: the real training code on a tiny model on CPU",
    "safety: secrets, notebook hygiene, research banner",
]
