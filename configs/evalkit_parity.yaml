# E3.2 parity run (Tech Spec §7.2, RUN-04): the main configuration with only the bf16 fine-tune,
# served by `ggh serve-hf` (Transformers, port 8082). EvalKit is pinned by git commit 06591f8 (D-28).
# Gemma reaches EvalKit through the `endpoints` route: llama-server started by `ggh serve` (D-7).
models: [gemma-e2b-grounded-bf16]
endpoints:
  gemma-e2b-grounded-bf16: http://127.0.0.1:8082/v1
judges: [claude-opus-5-5, gpt-6.1-sol]
extractor: claude-haiku-5-5
structured_output: true          # D-6
max_output_tokens: 2048
concurrency: {anthropic: 8, openai: 8, openai_compatible: 1}
seed: 7                          # same as EvalKit's reference run, so its 200 cases can hit the cache
default_effort: medium
judge_effort: medium
extractor_effort: medium
max_cost_usd: 70
