# V2.2 off-scope and paraphrase-probe runs (VEV-05, B8, H4): the main v2 configuration with only
# the v2 fine-tune. The other models' off-scope and probe answers stay as E3.2 recorded them.
# DRAFT until configs/eval_plan_v2.yaml is finalised and hashed.
# Gemma reaches EvalKit through the `endpoints` route: llama-server started by `ggh serve` (D-7).
models: [gemma-e2b-grounded-v2-q4]
endpoints:
  gemma-e2b-grounded-v2-q4: http://127.0.0.1:8083/v1
judges: [gpt-6.1-sol]            # OWNER D-57: Sol alone
extractor: gpt-6-luna             # OWNER D-57: replaces Haiku 5.5
structured_output: true          # D-6
max_output_tokens: 2048
concurrency: {openai: 8, openai_compatible: 1}
seed: 7
default_effort: medium
judge_effort: medium
extractor_effort: medium
max_cost_usd: 1.5  # OWNER D-53/D-57: the V2.2 caps sum to $25
