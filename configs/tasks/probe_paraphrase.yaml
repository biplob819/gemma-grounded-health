# Generated by `ggh tasks` from EvalKit's built-in pubmedqa task; do not edit.
name: ggh_probe_paraphrase
dataset: ../../data/probe_paraphrase.jsonl
split: probe_paraphrase
labels:
- 'yes'
- 'no'
- maybe
prompt_template: 'You are answering a research question using only the numbered sentences from a

  scientific abstract below. This is a research benchmark, not medical advice.


  Question: {question}


  Abstract sentences:

  {numbered_context}


  Reply with JSON only, in this shape:

  {{"label": one of {labels}, "answer": "two to four sentences", "citations": [sentence numbers]}}


  Rules:

  - Base every statement on the sentences above, not on outside knowledge.

  - Cite the sentence numbers (1 to {n_sentences}) that support your answer.

  - Choose "maybe" when the sentences do not settle the question.

  '
output_schema: answer_v1
scorers:
- label_correct
- citation_valid
- groundedness
- coverage
- cost
- latency
thresholds:
- metric: headline
  op: '>='
  value: 0.6
