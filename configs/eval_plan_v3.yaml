# v3 pre-registration (RLR-07, OWNER D-66), fixed and hashed BEFORE any GRPO training step and
# before any v3 measurement. Modelled on configs/eval_plan_v2.yaml. Its sha256 is in
# docs/measurements/eval_plan_v3.sha256 and its commit in docs/measurements/preregistrations.jsonl;
# tests/results/test_preregistration.py checks every run below started after that commit.
# The reward and the training recipe are pinned here by hash, so neither can change after this.
status: final
version: v3
node: V3.1
built_after_test_seen: true    # v3 is built after v1's and v2's PQA-L results were seen (D-43)
method: GRPO from v2's adapter with the programmatic reward; no judge in the training loop
pinned:                        # everything that shapes training, by sha256 (none may change after this)
  reward: {file: src/ggh/rl/reward.py, sha256: 3e79e634b3f137e5f33a6489ffae31fecd7eb326592ce6090074c650f6d5db69}
  trainer: {file: src/ggh/rl/grpo.py, sha256: 2813e430e12a320d0606d30c577fc62b69bd051b5475ef62860fa0279628ef53}
  rules: {file: src/ggh/targets/rules.py, sha256: fc644b6bc104e141538429e236c0a83bebb88b7344fba3a95d9fd5d60cd75eca}
  recipe_schema: {file: src/ggh/rl/config.py, sha256: 0583a1b9a87286d4c93e28d31a9786ba63c1dc6f7691003e987902181269ecac}
  recipe: {file: configs/recipe_v3_grpo.yaml, sha256: 62b5ade563d8e0283a4ed70970465f3ab3eb8b0f2e88bfe89267ce97f001620a}
  packages: {file: notebooks/requirements-kaggle-grpo.txt, sha256: 8217e0e06094d79cdff42b6fa9a6fd35dd0eaee55532668c87271c3a84bcd8c4}
training_data: the 2,722 v2 train prompts and gold labels (train split only; no dev or test use)
trial: >-
  one short run (40 GRPO steps) before the main run, on the train prompts, read on the first 200
  dev prompts with the reward. It stops the plan, with the owner told, if the trial's final
  adapter against v2's replies in the same session has: parse failures above 0.02; mean reward
  more than 0.05 below v2's; or a "maybe" or "yes" share guard below failing (the trial's 200 rows
  hold only 21 gold "no" rows, so the gold-"no" accuracy guard is reported there, not applied). It may not change the reward,
  the recipe or this plan; a change needs a new plan and hash before the main run, recorded as a
  decision
checkpoint_selection: >-
  candidates are every saved checkpoint-N and the final adapter of the main run. On the first 500
  dev_eval prompts (greedy, unconstrained, scored by the reward in the same Kaggle session as
  v2's own replies), pick the candidate with the highest mean reward among those that keep every
  hack guard (each as `ggh rl-dev` computes it, every share over all rows), ties to the earlier step (the final adapter counts as its last step). Guards, each
  against v2's replies in that session: parse failures at most 0.01; "maybe" share within v2's
  plus or minus 0.05; "yes" share at most v2's plus 0.05; accuracy on the gold-"no" rows at least
  v2's minus 0.05; mean answer words at least 0.8 of v2's; label accuracy at least v2's minus
  0.02; aim-citation share at most v2's. dev_eval has no gold "maybe" rows (457 yes, 43 no), so
  dev cannot show whether v3 answers "maybe" well; the reward pays the most likely label (no
  premium for yes/no over maybe) and PQA-L's maybe cases are measured only in the scoring run.
  If no candidate beats v2's mean reward under the guards, v3 is reported as not improving on
  dev, the owner is asked whether to score it (the result is published either way). The
  selected adapter's hash and its Q4_K_M GGUF hash are committed before the main run.
evalkit: f9cbc8e5396c4fc638021cb426cc34e2d6853d78   # evalkit-harness==0.4.0, as V2.2 (D-56)
provider: openai_only          # owner, 2026-11-21: "Use open AI API" (as OWNER D-57)
task: pubmedqa
task_file: configs/tasks/pubmedqa_cit.yaml
n_cases: 1000                  # the same 1,000 PQA-L cases as E3.2 and V2.2 (seed 7)
seed: 7
quantization: Q4_K_M           # as v2's published numbers
metric: headline
judges: [gpt-6.1-sol]          # as V2.2 (OWNER D-57)
extractor: gpt-6-luna          # as V2.2 (OWNER D-57)
primary:                       # one primary comparison: v3 minus v2
  - [gemma-e2b-grounded-v3-q4, gemma-e2b-grounded-v2-q4]
primary_metrics:
  - {metric: headline, better: higher}   # correct and fully grounded share; v2 0.329 (V2.2)
guardrails:                    # v3's own values; a miss is reported as a failed guardrail
  - {metric: citation_precision, min: 0.70}   # v2 0.736 (V2.2)
  - {metric: aim_citation_rate, max: 0.10}    # v2 0.084 (V2.2)
stretch:
  - {metric: headline, reach: 0.404}          # the base model's V2.2 headline
holm: family                   # a family of one primary test, so Holm leaves its p-value unchanged
bootstrap: {resamples: 10000, seed: 7, alpha: 0.05}
rule: >-
  v3 "improves on v2" only if v3's headline is above v2's (0.329 in V2.2) and the paired
  bootstrap 95% interval of v3 minus v2 on the shared 1,000 cases (10,000 resamples, seed 7,
  EvalKit's stats functions) excludes zero, with Holm applied over the primary family (one test);
  otherwise the gap is reported as a tie, whichever way the point estimate falls. The guardrails
  are bars on v3's own values, not tests: citation precision at least 0.70 and aim-citation rate
  at most 0.10, computed as in configs/eval_plan_v2.yaml. Reaching the base model's 0.404 is a
  stretch goal, reported, not tested. v2 and base answers, claims and verdicts come from the
  V2.2 run's cache, so only v3 is new; v1's and v2's published comparisons stand as published.
report_beside_headline: >-
  v3's label distribution (yes, no, maybe) and mean and maximum answer length in words, next to
  v2's and base's from the same run, so a shift toward "maybe" or shorter answers is visible
secondary: >-
  v3 minus base on the three V2.2 outcomes (exploratory, not Holm-corrected), accuracy,
  groundedness, citation validity, B1-B7 for v3, and the dev reward trace from training
runs:
  - name: main_v3
    purpose: the primary comparison, guardrails and the stretch goal for v3
    config: configs/evalkit_v3.yaml
    task: configs/tasks/pubmedqa_cit.yaml
    n: 1000
    new_models: [gemma-e2b-grounded-v3-q4]
    cached_models: [gemma-e2b-base-q4, gemma-e2b-grounded-v2-q4]   # answers, claims and verdicts
    citation_support: true
    results: docs/results/main_v3
    command: uv run evalkit run configs/evalkit_v3.yaml --task configs/tasks/pubmedqa_cit.yaml --n 1000
spend: >-
  the main_v3 run's cost into docs/measurements/spend-ledger.jsonl, node V3.3; its cap is set by
  the owner before the run (asked with the ask widget) and EvalKit's max_cost_usd enforces it.
  Training costs no API money (Kaggle T4, GPU hours logged)
