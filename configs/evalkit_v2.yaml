# V2.2 main run (VEV-04), OpenAI only (OWNER D-57): base, v1 and v2 on the E3.2 cases.
# Base and v1 answers come from EvalKit's answer store (their servers stay stopped, so a miss
# fails); every model's claims are extracted by GPT-6 Luna and judged by GPT-6.1 Sol.
# Gemma reaches EvalKit through the `endpoints` route: llama-server started by `ggh serve` (D-7).
models: [gemma-e2b-base-q4, gemma-e2b-grounded-q4, gemma-e2b-grounded-v2-q4]
endpoints:
  gemma-e2b-base-q4: http://127.0.0.1:8080/v1
  gemma-e2b-grounded-q4: http://127.0.0.1:8081/v1
  gemma-e2b-grounded-v2-q4: http://127.0.0.1:8083/v1
judges: [gpt-6.1-sol]            # OWNER D-57: Sol alone
extractor: gpt-6-luna             # OWNER D-57: replaces Haiku 5.5
structured_output: true          # D-6
max_output_tokens: 2048
concurrency: {openai: 8, openai_compatible: 1}
seed: 7                          # the E3.2 main run's seed, so the cached cases are the same 1,000
default_effort: medium
judge_effort: medium
extractor_effort: medium
max_cost_usd: 16  # OWNER D-53/D-57: the V2.2 caps sum to $25
