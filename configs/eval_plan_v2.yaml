# V2.2 pre-registration, finalised under OWNER D-57 (VEV-03, Tech Spec §7.4, H9, OWNER D-43). Modelled on configs/eval_plan.yaml.
# To finalise, after v2's TrainRun is frozen and before any v2 PQA-L run: fill the `fill at
# finalisation` fields, set `status: final`, write sha256 of this file's bytes to
# docs/measurements/eval_plan_v2.sha256, commit both, and append the commit and its time to
# docs/measurements/preregistrations.jsonl. tests/results/test_preregistration.py then checks,
# for every run below that has results, that the hash was committed before the run started.
status: final
version: v2
node: V2.2
built_after_test_seen: true    # OWNER D-43: v2 was built after v1's PQA-L results were seen
evalkit: f9cbc8e5396c4fc638021cb426cc34e2d6853d78   # D-56: evalkit-harness==0.4.0 (tag v0.4.0)
provider: openai_only          # OWNER D-57: the Anthropic credit is exhausted; owner: "Use Open AI API"
checkpoint:                    # the frozen v2 TrainRun (VTG-05), step 340
  train_run: docs/measurements/v2/train_run.json
  adapter_sha256: e5f97861693346623bf55305c0b911e10fe9a9dcc0985e535db30dad74f4e3db
  gguf_q4_k_m_sha256: 6da2c13ee1a3b94c99f9107bb27f344539364cdad371caea4b1114ef91b5be45
task: pubmedqa                 # EvalKit's built-in PQA-L task, plus citation_support (OWNER D-44)
task_file: configs/tasks/pubmedqa_cit.yaml
n_cases: 1000                  # the same 1,000 PQA-L cases as the E3.2 main run (OWNER D-17)
seed: 7
config: configs/evalkit_v2.yaml
metric: headline               # kept for the E3.2 plan's shape; the outcomes are below
judges: [gpt-6.1-sol]          # OWNER D-57: Sol alone (v1's E3.2 plan had Opus and Sol)
extractor: gpt-6-luna          # OWNER D-57: replaces Claude Haiku 5.5 for every model scored here
primary:                       # OWNER D-53: model minus model, per outcome (one judge, D-57)
  - [gemma-e2b-grounded-v2-q4, gemma-e2b-grounded-q4]
  - [gemma-e2b-grounded-v2-q4, gemma-e2b-base-q4]
primary_metrics:               # OWNER D-53: three primary outcomes, each with its direction
  - {metric: headline, better: higher}             # correct and fully grounded share
  - {metric: citation_precision, better: higher}   # cited sentences that support a claim
  - {metric: aim_citation_rate, better: lower}     # answers citing an unsupporting aim sentence
holm: family                   # Holm over the 6 primary tests (2 pairs x 3 outcomes x 1 judge, D-57)
bootstrap: {resamples: 10000, seed: 7, alpha: 0.05}
shown_not_compared:            # OWNER D-57: not re-scored; their published numbers (Haiku-extracted,
  - claude-haiku-5-5             # Opus and Sol judged: docs/results/main, main_citation) are shown beside
  - gpt-6-luna                   # v2's with that difference stated, never as a v2 comparison
rule: >-
  A gap is "separated" only if its paired bootstrap p-value (shared cases, 10,000 resamples,
  seed 7, EvalKit's stats functions) stays below 0.05 after Holm correction across the six
  primary tests; otherwise it is reported as a tie, whichever way the point estimate falls.
  "Better" follows each outcome's direction: higher headline and citation precision, lower
  aim-citation rate. Per-case values are EvalKit's: correct_and_grounded per judge; citation
  precision pooled over each answer's distinct cited sentences (a sentence supports if any of its
  claims' citation_support entries does), which reproduces EvalKit's summary; aim-citation rate
  pooled over answers with citation_support entries (an answer counts if a cited sentence's
  majority role, EvalKit's tie order, is aim and it supports no claim), which reproduces
  EvalKit's summary. v1's E3.2 comparisons stand as published under their own plan.
secondary: >-
  everything else: accuracy, groundedness, citation validity, B1-B8, v1 minus base under Luna and
  Sol (against E3.2's Haiku-extracted numbers, to show the extractor's effect), and Haiku 5.5 and
  GPT-6 Luna from their published runs (not compared with v2)
cache:
  source_run: r-edfcba37159e   # the v1 citation rescore (docs/results/main_citation/)
  expected_hits: [gemma-e2b-base-q4, gemma-e2b-grounded-q4]
  rule: >-
    OWNER D-57: base and v1 answers come from EvalKit's answer store and must equal their
    completions in docs/results/main_citation/ on all 1,000 cases (raw text identical); their
    llama servers stay stopped during the run, so a miss fails instead of regenerating. Their
    claims, claim verdicts and citation verdicts are new (Luna, Sol). Any answer miss is a
    deviation and is reported.
runs:
  - name: main_v2
    purpose: headline, primary comparisons, B1-B7 for v2 (VEV-04)
    config: configs/evalkit_v2.yaml
    task: configs/tasks/pubmedqa_cit.yaml
    n: 1000
    new_models: [gemma-e2b-grounded-v2-q4]
    cached_models: [gemma-e2b-base-q4, gemma-e2b-grounded-q4]     # answers only (D-57)
    rescored_models: [gemma-e2b-base-q4, gemma-e2b-grounded-q4]   # re-extracted, re-judged
    citation_support: true
    results: docs/results/main_v2
    command: uv run evalkit run configs/evalkit_v2.yaml --task configs/tasks/pubmedqa_cit.yaml --n 1000
  - name: offscope_v2
    purpose: B8 for v2, owner review of its 20 answers (VEV-05)
    config: configs/evalkit_v2_solo.yaml
    task: configs/tasks/offscope.yaml
    n: 20
    new_models: [gemma-e2b-grounded-v2-q4]
    cached_models: []
    citation_support: false
    results: docs/results/offscope_v2
    command: uv run evalkit run configs/evalkit_v2_solo.yaml --task configs/tasks/offscope.yaml --n 20
  - name: probe_original_v2
    purpose: paraphrase probe, original wording (VEV-05, D-42, H4)
    config: configs/evalkit_v2_solo.yaml
    task: configs/tasks/probe_original.yaml
    n: 100
    new_models: [gemma-e2b-grounded-v2-q4]
    cached_models: []
    citation_support: false
    results: docs/results/probe_original_v2
    command: uv run evalkit run configs/evalkit_v2_solo.yaml --task configs/tasks/probe_original.yaml --n 100
  - name: probe_paraphrase_v2
    purpose: paraphrase probe, paraphrased wording; drop = original minus paraphrased accuracy
    config: configs/evalkit_v2_solo.yaml
    task: configs/tasks/probe_paraphrase.yaml
    n: 100
    new_models: [gemma-e2b-grounded-v2-q4]
    cached_models: []
    citation_support: false
    results: docs/results/probe_paraphrase_v2
    command: uv run evalkit run configs/evalkit_v2_solo.yaml --task configs/tasks/probe_paraphrase.yaml --n 100
  - name: parity_v2
    purpose: judged parity (runs, OWNER D-53), bf16 minus Q4_K_M headline on the same 200 cases; reported, not gated
    config: configs/evalkit_v2_parity.yaml
    task: configs/tasks/pubmedqa_cit.yaml
    n: 200
    new_models: [gemma-e2b-grounded-v2-bf16]
    cached_models: []
    citation_support: true
    results: docs/results/parity_v2
    command: uv run evalkit run configs/evalkit_v2_parity.yaml --task configs/tasks/pubmedqa_cit.yaml --n 200
dev_parity:                    # VEV-02, local, $0, gated before any paid v2 run
  what: v2 Q4_K_M against merged bf16 on the 500 dev_eval prompts, as X3.1
  bars: {label_agreement_min: 0.95, schema_valid_within_points: 1}
  output: docs/measurements/parity_report_v2.json
estimate:
  cache_aware: uv run ggh results estimate --plan configs/eval_plan_v2.yaml
  evalkit_dry_run: >-
    the `command` of each run with --dry-run appended (no API calls). EvalKit prices every
    model as uncached and assumes 4.5 claims per answer, so it overstates the spend; both
    numbers are recorded before each run (RUN-02). Caps: main_v2 $16, offscope_v2 and the probe
    runs $1.50 each, parity_v2 $4.50: $25 in all (OWNER D-53).
spend: every run's cost from its run.json into docs/measurements/spend-ledger.jsonl, node V2.2,
  with note "v2, built after v1's test results were seen (OWNER D-43)" (VEV-06, D-22)
