# Dev smoke run (Tech Spec §7.2): the base model only, before the fine-tune exists. Every
# setting except `models`, `endpoints` and `max_cost_usd` equals configs/evalkit.yaml.
models: [gemma-e2b-base-q4]
endpoints:
  gemma-e2b-base-q4: http://127.0.0.1:8080/v1
judges: [claude-opus-5-5, gpt-6.1-sol]
extractor: claude-haiku-5-5
structured_output: true          # D-6
max_output_tokens: 2048
concurrency: {anthropic: 8, openai: 8, openai_compatible: 1}
seed: 7
default_effort: medium
judge_effort: medium
extractor_effort: medium
max_cost_usd: 5
