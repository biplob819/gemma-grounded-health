<text x="544.0" y="528" text-anchor="middle" font-size="11.5" fill="#33405a">two model families</text>
<text x="544.0" y="544" text-anchor="middle" font-size="11.5" fill="#33405a">claim verdicts with evidence</text>
<line x1="544" y1="410" x2="544" y2="470" stroke="#55647d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="744" y="470" width="200" height="110" rx="8" fill="#eef6ee" stroke="#3b7a4a" stroke-width="1.5"/>
