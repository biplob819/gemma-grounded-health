<text x="1060.0" y="342" text-anchor="middle" font-size="11.5" fill="#33405a">bf16 merge on CPU</text>
<text x="1060.0" y="358" text-anchor="middle" font-size="11.5" fill="#33405a">llama.cpp b12421 GGUF</text>
