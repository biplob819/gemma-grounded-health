<text x="124.0" y="358" text-anchor="middle" font-size="11.5" fill="#33405a">GPT-6 Luna</text>
<text x="124.0" y="374" text-anchor="middle" font-size="11.5" fill="#33405a">(answers via API)</text>
<line x1="224" y1="355.0" x2="404" y2="355.0" stroke="#55647d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="314.0" y="349.0" text-anchor="middle" font-size="10.5" fill="#55647d">answers</text>
<rect x="404" y="470" width="280" height="110" rx="8" fill="#f4eefb" stroke="#6b4a9a" stroke-width="1.5"/>
