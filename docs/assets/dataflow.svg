<text x="844.0" y="512" text-anchor="middle" font-size="11.5" fill="#33405a">accuracy, groundedness,</text>
<text x="844.0" y="528" text-anchor="middle" font-size="11.5" fill="#33405a">correct and fully grounded</text>
<text x="844.0" y="544" text-anchor="middle" font-size="11.5" fill="#33405a">95% intervals, Holm</text>
