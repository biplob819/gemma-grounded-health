<text x="824.0" y="374" text-anchor="middle" font-size="11.5" fill="#33405a">JSON-schema constrained</text>
<line x1="964" y1="355.0" x2="924" y2="355.0" stroke="#55647d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="404" y="300" width="280" height="110" rx="8" fill="#eef1fb" stroke="#3b5b92" stroke-width="1.5"/>
<text x="544.0" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2433">EvalKit (pinned)</text>
<text x="544.0" y="342" text-anchor="middle" font-size="11.5" fill="#33405a">same prompt + JSON schema for 4 models</text>
<text x="544.0" y="358" text-anchor="middle" font-size="11.5" fill="#33405a">claims extracted, judged per claim</text>
<text x="544.0" y="374" text-anchor="middle" font-size="11.5" fill="#33405a">against the cited sentences only</text>
