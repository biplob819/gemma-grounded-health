<text x="364.0" y="148" text-anchor="middle" font-size="11.5" fill="#33405a">train / val / dev splits</text>
<text x="364.0" y="164" text-anchor="middle" font-size="11.5" fill="#33405a">EvalKit prompt rendering</text>
