name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste API keys, Hugging Face or Kaggle tokens, or `.env` contents.**
        Security problems go to private vulnerability reporting (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran, or the question and abstract you gave the model.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ggh doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: Version (`ggh --version`) or model revision
    validations:
      required: true
