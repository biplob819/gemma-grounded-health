    - { metric: "Label accuracy", kind: quality, current: "0.728 (base 0.501)", how: "EvalKit label_correct with bootstrap intervals" }
    - { metric: "Laptop file agrees with full precision on dev labels", kind: guardrail, target: "≥ 0.95", current: "0.956", how: "ggh parity on 500 dev questions before any benchmark" }
    - { metric: "Spend per main run", kind: cost, target: "Hard cap $70", current: "$53.68", how: "EvalKit dry-run estimate first; every dollar in the spend ledger" }
  next:
