stack: [Gemma 4 E2B, Unsloth, Kaggle T4, llama.cpp, EvalKit, Claude API, OpenAI API, Hugging Face]
cost: "$53.68 for the v1 main run (1,000 questions, four models, dual judges); $4.00 for v2's, with base and v1 answers from EvalKit's cache"

case_study: docs/case-study.md

methodology:
  - Evaluated with EvalKit (pinned release), all 1,000 expert-labelled PubMedQA questions
  - Claim-level judging against the cited sentences only
  - v1 judged by Claude Opus 5.5 and GPT-6.1 Sol; v2 by GPT-6.1 Sol, calibrated against a Claude Opus 5.5 reference labeller
  - Paired bootstrap 95% intervals, Holm correction, fixed separation rule
  - Pre-registered comparisons, hashed before each main run
  - Checkpoint chosen on dev data only; test set never used for tuning

