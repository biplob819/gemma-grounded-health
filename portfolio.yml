stack: [Gemma 4 E2B, Unsloth, Kaggle T4, llama.cpp, EvalKit, Claude API, OpenAI API]
cost: "$53.68 for the v1 main run (1,000 questions, four models, dual judges)"

case_study: docs/case-study.md

methodology:
  - Evaluated with EvalKit (pinned commit), all 1,000 expert-labelled PubMedQA questions
  - Claim-level judging against the cited sentences only
  - Dual cross-family LLM judges (Claude Opus 5.5, GPT-6.1 Sol)
  - Paired bootstrap 95% intervals, Holm correction, fixed separation rule
  - Pre-registered comparisons, hashed before the main run
  - Checkpoint chosen on dev data only; test set never used for tuning

story:
  monitoring:
    - { metric: "Correct and fully grounded (Opus judge)", kind: north-star, target: "Above base, separated", current: "0.388 (base 0.418)", how: "EvalKit main run on 1,000 PubMedQA questions, paired bootstrap with Holm correction" }
